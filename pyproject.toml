[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vba2py"
version = "0.1.0"
description = "AST-based VBA to Python transpiler"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vlad Popov" }]
keywords = ["vba", "python", "transpiler", "excel", "macro", "converter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "openpyxl>=3.1",
    "black>=24.0",
    "oletools>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
vba2py = "vba2py.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vba2py", "src/vba_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
